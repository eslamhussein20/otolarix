<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E3A8A">
<link rel="manifest" href="manifest.webmanifest?v=2.8.5">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2.8.5">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2.8.5">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2.8.5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Otolarix">
<title>Otolarix</title>
<style>
:root{--red:#B42318;--redbg:#FEF3F2;--amber:#9A4D00;--amberbg:#FFFAEB;--ok:#067647;--okbg:#ECFDF3;--r:14px}
[data-theme=teal]{--pri:#0B6670;--pri2:#103B45;--soft:#E4F1F1;--bg:#F4F8F8;--card:#FFFFFF;--text:#172A31;--muted:#53666D;--line:#D9E5E7;--accent:#70D7C7;--icon1:#0B3039;--icon2:#176C75}
[data-theme=blue]{--pri:#1D4ED8;--pri2:#1E3A8A;--soft:#EAF1FF;--bg:#F5F8FF;--card:#FFFFFF;--text:#0F1E3D;--muted:#4B5B78;--line:#D9E3F5;--accent:#3B82F6;--icon1:#1E3A8A;--icon2:#2563EB}
[data-theme=ocean]{--pri:#1B5674;--pri2:#17384B;--soft:#E7F0F5;--bg:#F3F7F9;--card:#FFFFFF;--text:#182B38;--muted:#526875;--line:#D9E3E9;--accent:#75BBD2;--icon1:#122B3B;--icon2:#28718E}
[data-theme=dark]{--pri:#096B73;--pri2:#102D37;--soft:#182E38;--bg:#0B141B;--card:#14212A;--text:#E8F0F4;--muted:#A6B7C1;--line:#2B3C47;--accent:#56D9CB;--icon1:#0B3039;--icon2:#176C75;--redbg:#351B22;--amberbg:#332A18;--okbg:#153027;--red:#FF9D91;--amber:#FFD166;--ok:#69D7A2}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:var(--text);background:var(--bg);font-size:15px}
a{color:var(--pri)}
/* top bar */
.top{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;cursor:pointer}
.logo i{width:36px;height:36px;display:block;font-style:normal}.logo i svg,.applogo svg{display:block;width:100%;height:100%;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
/* desktop: vertical sidebar on the left */
.tnav{position:fixed;left:0;top:0;bottom:0;width:210px;z-index:25;display:flex;flex-direction:column;gap:4px;padding:76px 12px 16px;background:linear-gradient(180deg,var(--pri2),var(--pri));box-shadow:2px 0 12px rgba(0,0,0,.12);overflow-y:auto}
.tnav a{color:#e8f3f5;text-decoration:none;padding:11px 14px;border-radius:11px;font-size:15px;display:flex;gap:10px;align-items:center;transition:.15s}
.tnav a:hover{background:rgba(255,255,255,.12)}
.tnav a.on{background:rgba(255,255,255,.22);color:#fff;font-weight:700}
@media(min-width:761px){body{padding-left:210px}.top{margin-left:-210px;padding-left:228px}.langbtn{margin-inline-start:auto}
 body.navc{padding-left:68px}body.navc .top{margin-left:-68px;padding-left:86px}}
.tnav,.top,body{transition:width .2s,padding .2s,margin .2s}
.tnav .ni{font-size:20px;width:24px;text-align:center;flex:0 0 24px}
.tnav .nt{white-space:nowrap;overflow:hidden}
.navtog{margin-top:auto;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:11px;padding:10px;cursor:pointer;font:inherit;display:flex;gap:10px;align-items:center;justify-content:center}
.navtog:hover{background:rgba(255,255,255,.22)}
body.navc .tnav{width:68px;padding-left:10px;padding-right:10px}
body.navc .tnav a{justify-content:center;padding:11px 0}
body.navc .tnav .nt{display:none}
.langbtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:5px 12px;cursor:pointer;font:inherit;font-weight:700}
.bnav{display:none}
main{max-width:1280px;margin:auto;padding:16px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.card h2 .ic{width:30px;height:30px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-size:16px}
.card h2 .en{color:var(--muted);font-weight:400;font-size:13px}
h1.page{font-size:22px;margin:4px 0 14px}
.muted{color:var(--muted);font-size:13px}
.req{color:var(--red)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 12px;text-align:center;cursor:pointer;position:relative;transition:.15s;text-decoration:none;color:var(--text)}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tiles .tile{min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tile .ti{width:52px;height:52px;border-radius:16px;margin:0 auto 8px;display:grid;place-items:center;font-size:26px}
.tile b{display:block;font-size:14px}
.tile .badge{position:absolute;top:8px;inset-inline-end:8px;background:var(--red);color:#fff;border-radius:12px;padding:1px 8px;font-size:12px}
.c1{background:#E0F2F1}.c2{background:#E8EFFE}.c3{background:#FDF2E3}.c4{background:#F1EAFE}.c5{background:#FDE9F2}.c6{background:#E7F6EC}
[data-theme=dark] .tile .ti{filter:brightness(.8)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;border-inline-start:5px solid var(--pri)}
.stat .v{font-size:26px;font-weight:800}
.stats{align-items:stretch}.stat{min-height:92px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.week-chart{height:190px}.week-chart svg{width:100%;height:145px;display:block;overflow:visible}.week-chart .bar{fill:var(--pri);opacity:.86}.week-chart text{fill:var(--muted);font:12px "Segoe UI",Tahoma,Arial,sans-serif}.week-chart .count{fill:var(--text);font-weight:700}
.empty-state{display:flex;align-items:center;gap:12px;padding:12px;border:1px dashed var(--line);border-radius:12px;background:var(--bg)}.empty-state .ui-icon{width:30px;height:30px;flex-basis:30px;color:var(--pri)}.empty-state p{margin:0;flex:1}
.stat.red{border-inline-start-color:var(--red)}.stat.amber{border-inline-start-color:#F79009}.stat.ok{border-inline-start-color:#12B76A}
.hero{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;border-radius:var(--r);padding:18px 20px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hero h1{margin:0;font-size:22px}.hero p{margin:4px 0 0;opacity:.85}
.hero .btn{background:#fff;color:var(--pri2);margin-inline-start:auto}
/* forms */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
input,select,textarea{width:100%;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text)}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);border-color:var(--pri)}
input:disabled,select:disabled,textarea:disabled{opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:18px;padding:5px 12px;cursor:pointer;font-size:13px;user-select:none}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chip.no{background:var(--bg);color:var(--muted);text-decoration:line-through}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px 12px}
.checks label{display:flex;gap:6px;align-items:center;color:var(--text);font-size:14px;margin:0}
.checks input{width:auto}
.exam{display:grid;grid-template-columns:180px 140px 1fr;gap:6px 10px;align-items:center}
.exam .h{font-weight:600;font-size:13px;color:var(--muted)}
table.aud{border-collapse:collapse;direction:ltr;font-size:13px}
table.aud td,table.aud th{border:1px solid var(--line);padding:3px}
table.aud input{width:58px;padding:4px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 15px;font:inherit;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.btn.sec{background:var(--card);color:var(--pri);border:1px solid var(--pri)}
.btn.dark{background:#10A37F}
.btn.claude{background:#C2662D}
.btn.red{background:var(--red)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px}
.side{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 90px);overflow:auto}
.alert{border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.alert.red{background:var(--redbg);border:1px solid #FDA29B;color:var(--red)}
.alert.amber{background:var(--amberbg);border:1px solid #FEC84B;color:var(--amber)}
.alert.ok{background:var(--okbg);border:1px solid #75E0A7;color:var(--ok)}
.alert.info{background:var(--soft);border:1px solid var(--line);color:var(--text)}
.alert ul{margin:4px 0 0;padding-inline-start:18px}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;background:var(--soft);color:var(--text)}
.tag.signed{background:var(--okbg);color:var(--ok)}.tag.urgent{background:var(--redbg);color:var(--red)}.tag.draft{background:var(--amberbg);color:var(--amber)}
.list .item{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;color:var(--pri);flex:0 0 auto}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* timeline */
.tl{position:relative;padding-inline-start:26px}
.tl:before{content:"";position:absolute;inset-inline-start:9px;top:4px;bottom:4px;width:3px;background:var(--line);border-radius:2px}
.tl .ev{position:relative;margin-bottom:14px}
.tl .ev:before{content:"";position:absolute;inset-inline-start:-23px;top:14px;width:13px;height:13px;border-radius:50%;background:var(--pri);border:3px solid var(--card);box-shadow:0 0 0 2px var(--pri)}
.tl .ev.urg:before{background:var(--red);box-shadow:0 0 0 2px var(--red)}
.tl .ev.fu:before{background:#F79009;box-shadow:0 0 0 2px #F79009}
/* steps (guide) */
.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative}
.step .n{width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:8px}
.step .e{position:absolute;top:12px;inset-inline-end:12px;font-size:24px}
details.faq{border-bottom:1px solid var(--line);padding:10px 0}
details.faq summary{cursor:pointer;font-weight:600}
/* theme swatches */
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:46px;height:46px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw button.on{border-color:var(--text)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,30,.55);display:grid;place-items:center;z-index:100;padding:16px}
.modal .box{background:var(--card);border-radius:18px;max-width:520px;width:100%;padding:22px;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(6px);background:var(--pri2);color:#fff;padding:13px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:200;pointer-events:none;max-width:min(92vw,560px);min-height:48px;text-align:center;display:flex;align-items:center;justify-content:center;gap:9px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.settings-group{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;margin:18px 4px 8px}.settings-group:first-of-type{margin-top:4px}
.hidden{display:none!important}
.ltr{direction:ltr;text-align:left}
.meds td{padding:3px}.meds input{padding:6px}
.chat{max-height:520px;overflow:auto;display:flex;flex-direction:column;gap:10px;margin:10px 0}
.msg{padding:10px 12px;border-radius:14px;line-height:1.7;font-size:14px;unicode-bidi:plaintext}
.msg.user{background:var(--soft);align-self:flex-end;max-width:88%}
.msg.model{border:1px solid var(--line);background:var(--card)}
.msg h4{margin:10px 0 4px;color:var(--pri);font-size:15px}
.msg ul,.msg ol{margin:4px 0;padding-inline-start:20px}
.msg pre{direction:ltr;text-align:left;background:#0f1f30;color:#e6f0f3;padding:34px 10px 10px;border-radius:9px;white-space:pre-wrap;font-size:12.5px;position:relative;margin:6px 0}
.msg pre button{position:absolute;top:6px;right:6px;font-size:11px;padding:3px 8px}
.msg .sum{color:var(--muted);font-size:13px;cursor:pointer}
.typing{color:var(--muted);font-size:13px;padding:6px}
.chatin{display:flex;gap:6px;align-items:flex-end}.chatin textarea{min-height:44px}
.chat-commands{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;padding:4px 1px 8px;scrollbar-width:thin}
.chat-commands .chip{flex:0 0 auto;min-height:40px;display:flex;align-items:center}
.chatin{position:sticky;bottom:0;background:var(--card);padding:8px 0 2px;z-index:2;border-top:1px solid var(--line)}
.msg-time{display:block;color:var(--muted);font-size:11px;margin-top:5px;opacity:.88}
.typing:after{content:'•••';display:inline-block;overflow:hidden;vertical-align:bottom;width:0;animation:typingDots 1.2s steps(4,end) infinite}
@keyframes typingDots{to{width:2.2em}}
.msg pre{padding-top:38px}.msg pre button{min-height:32px}
.kstep{display:flex;gap:10px;align-items:flex-start;margin:8px 0}.kstep b.n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:13px}
/* prescription sheet */
.rx{background:#fff;color:#111;max-width:800px;margin:auto;border-radius:12px;padding:28px;border:1px solid var(--line)}
.rx .rh{display:flex;justify-content:space-between;gap:10px;border-bottom:3px solid var(--pri);padding-bottom:10px;margin-bottom:12px}
.rx h3{color:var(--pri);margin:16px 0 6px;font-size:15px}
.rx table{width:100%;border-collapse:collapse}
.rx table.rx-meds th{background:var(--soft);color:var(--pri2);font-weight:700}.rx table.rx-meds tr:nth-child(even) td{background:#F8FAFB}
.rx .rx-brand{font-size:18px;letter-spacing:.01em}.rx .rx-mark{background:var(--soft);border-radius:12px;padding:6px}
.rx td,.rx th{border:1px solid #ddd;padding:6px 8px;text-align:start;font-size:14px}
.rx th{background:#f4f7f8}
.rx .sig{margin-top:30px;display:flex;justify-content:space-between}
.rx .instr{white-space:pre-wrap;line-height:1.8}
.modal .box.wizard{max-width:620px;padding:22px;max-height:calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow:auto}
.wizard-head{text-align:center}.wizard-head .applogo{width:58px!important;height:58px!important}
.wizard-progress{display:flex;justify-content:center;gap:9px;margin:12px 0 16px}
.wizard-progress span{width:10px;height:10px;border-radius:50%;background:var(--line)}.wizard-progress span.on{background:var(--pri);box-shadow:0 0 0 4px var(--soft)}
.wizard-actions{display:flex;gap:10px;margin-top:16px}.wizard-actions .btn{min-height:48px;justify-content:center;flex:1}
.wizard .kstep{margin:5px 0;gap:8px}.wizard .kstep .btn{min-height:40px}
.wizard #aiSetup .alert{margin:4px 0;padding:9px}.wizard #aiSetup .row{gap:6px}.wizard #aiSetup .row .btn{min-height:40px;padding:6px 10px}
.wizard #gKey{min-height:44px}
/* compact clinical sections and mobile visit actions */
.case-section{padding:0;overflow:hidden}.case-section>summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;padding:14px 16px;min-height:52px;font-weight:700}
.case-section>summary::-webkit-details-marker{display:none}.case-section>summary h2{margin:0;flex:1}.case-section>summary:after{content:'＋';color:var(--muted);font-size:18px}.case-section[open]>summary:after{content:'−'}
.case-section[open]>.section-body{padding:0 16px 16px}.section-summary{display:none;color:var(--muted);font-size:12px;font-weight:400;margin-inline-start:auto;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.case-section:not([open]) .section-summary{display:inline-block}
.visit-actions{display:none}
.case-section:focus-within{scroll-margin-top:80px}
@media(max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none}}
@media(max-width:760px){
 body{font-size:16px;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
 input,select,textarea{font-size:16px}
 .tnav{display:none}
 main{padding:10px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .grid .wide{grid-column:1/-1}
 .checks{grid-template-columns:1fr}.checks label{padding:5px 0}
 .exam{grid-template-columns:repeat(2,minmax(0,1fr))}.exam .h{display:none}.exam input{grid-column:1/-1;margin-bottom:8px}
 .aud-wrap{overflow-x:auto}
 .tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
 .tile{padding:12px 4px}.tile .ti{width:44px;height:44px;font-size:22px}.tile b{font-size:12px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bnav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;position:relative}
 .bnav a span{font-size:21px}
 .bnav a.on{color:var(--pri);font-weight:700}
 .bnav a.new span{background:var(--pri);color:#fff;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin-top:-22px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
 .rx{padding:16px}
 .toast{bottom:calc(158px + env(safe-area-inset-bottom));max-width:calc(100vw - 24px)}
 .section-summary{max-width:48%}
 .visit-actions{display:flex;position:fixed;inset-inline:8px;bottom:calc(90px + env(safe-area-inset-bottom));z-index:35;align-items:center;gap:7px;padding:7px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
 .visit-actions .btn{min-height:44px;justify-content:center;padding:8px 11px}.visit-actions .alert-count{min-height:44px;border:0;border-radius:10px;background:var(--soft);color:var(--text);padding:6px 10px;font:inherit;font-weight:700}.visit-actions .alert-count.hot{background:var(--redbg);color:var(--red)}
 body{padding-bottom:calc(156px + env(safe-area-inset-bottom))}
}
/* consistent inline outline icons for interface controls */
.ui-icon{display:inline-flex;width:24px;height:24px;flex:0 0 24px;vertical-align:middle;align-items:center;justify-content:center}
.ui-icon svg{width:100%;height:100%;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.ti .ui-icon{width:28px;height:28px}.ic .ui-icon{width:20px;height:20px}.btn .ui-icon{width:20px;height:20px;flex-basis:20px}.step .e .ui-icon{width:24px;height:24px}
/* v2.5: dark readability, medicines, last visit, prescription page 2, activation */
[data-theme=dark] a,[data-theme=dark] .msg h4,[data-theme=dark] .bnav a.on,[data-theme=dark] .btn.sec,[data-theme=dark] .card h2 .ic,[data-theme=dark] .wizard-step-title{color:var(--accent)}
[data-theme=dark] .btn.sec{border-color:var(--accent)}
.medtag{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px;background:var(--amberbg);color:var(--amber);border:1px solid #FEC84B;cursor:pointer;white-space:nowrap}
tr.med-ai td{background:var(--amberbg)}

'use strict';
const DEFAULT_PROMPT = "ROLE\n\nYou are an ENT (otolaryngology, head and neck) clinical decision-support assistant working at the level of an experienced ENT consultant, helping a resident doctor in Egypt (emergency, clinic, pre-op, post-op). Give consultant-level reasoning, practical bedside guidance, safety-first decisions, and evidence-based advice. Do not claim to be a real physician or to have personal clinical experience.\n\nLANGUAGE (follow strictly)\n\n•\tReply in simple Egyptian Arabic, as a senior talks to a resident in the ward. Keep in English: medical terms, diagnoses, anatomy, drug names, doses, units, investigations (CT, MRI, CBC, audiogram), and ward words (airway, vitals, NPO, admit, discharge, follow-up, red flag, consult, OR, ICU, IV, SBAR). Everything else in Arabic.\n\n•\tExample: \"الـ airway لازم يتأمن الأول. افحص الـ oropharynx قبل أي تحليل للمريض.\"\n\n•\tUnderstand Arabic or English input, including dictated voice notes.\n\nPRIORITY ORDER (highest first)\n\n1.\tImmediate patient safety, stabilization, time-critical escalation. 2. Recognition of life-threatening ENT and non-ENT emergencies. 3. Evidence-based decisions and local emergency protocols. 4. Patient-specific findings, contraindications, available resources. 5. Scope boundaries and referral. 6. Format, language, question limits, style.\n\n•\tNever let a format rule, availability question, specialty boundary, or request for information delay airway management, hemorrhage control, emergency activation, or urgent referral. Never wait for tests, equipment, a full history, or answers before an essential action.\n\n•\tIf a non-ENT life-threatening condition is suspected, tell the resident to activate the emergency pathway now; do not manage it beyond stabilization.\n\n•\tIf instructions conflict, say so, choose the safer evidence-based action, and say what needs senior review. Never silently follow a lower-priority rule that could harm the patient.\n\n•\tIf information is missing, separate confirmed findings from assumptions, give safe immediate actions, and state the limits. Never fabricate findings, doses, guidelines, citations, results, or resource availability.\n\nSCOPE\n\n•\tHelp diagnose and manage ear, nose, throat, larynx, and head and neck conditions: history, ENT examination, ENT investigations, treatment.\n\n•\tENT symptoms can have serious non-ENT causes: do not ignore them, but do not diagnose or work up another specialty's disease. You may name a suspected non-ENT cause as a reason for referral (\"مشتبه فيه، ومحتاج تقييم عاجل\").\n\n•\tFinish the ENT history and examination first. If findings are normal or do not explain the symptoms, say so, state what was examined and what remains unassessed, and recommend the right specialty. Do not call an ENT assessment negative after a limited examination.\n\n•\tDo not recommend routine brain MRI, cardiac, endocrine, or other specialty tests for a stable patient, unless needed in a time-critical emergency or required by a local pathway. The colleague orders their own tests.\n\n•\tFor possible stroke, central vertigo, acute coronary syndrome, severe sudden headache with neurological signs, or other time-critical emergencies, tell the resident to call the emergency team now; do not wait for the ENT workup.\n\n•\tBrief non-ENT red-flag screening questions are allowed when they decide urgency. Orbital and intracranial complications of ENT infection stay in the ENT role. If unsure about scope, say so and advise the senior.\n\nCLINICAL-FIRST\n\n•\tBase the assessment on history, bedside examination, vitals, and evolution. Order a test only if it clarifies a meaningful uncertainty, assesses severity, excludes a dangerous condition, guides treatment, or decides disposition. For each test: one line on why and what it changes, labeled: مطلوب دلوقتي، أو مطلوب لو حصل كذا، أو مش لازم.\n\n•\tNever withhold a necessary test only because it is costly or unavailable: give its indication, urgency, and the referral or transfer route. A normal bedside exam does not exclude a dangerous condition when the exam has limited sensitivity.\n\n•\tJustified tests: suspected deep neck infection (imaging must not delay the airway); orbital or intracranial complications; foreign body not visible clinically; head and neck trauma with suspected fracture; penetrating ear injury with deeper signs; suspected head and neck malignancy, sinonasal tumor, or persistent neck mass; sudden or asymmetric sensorineural hearing loss (audiogram, MRI internal auditory canals); pre-op tests required by anesthesia or protocol; significant bleeding needing cross-match.\n\n•\tAn unstable patient is never made to wait for a test: secure the airway, control bleeding, stabilize, call the senior or emergency team first.\n\nRESOURCE AVAILABILITY\n\n•\tENT equipment is often missing in the ER (audiometer, tympanometer, flexible or rigid endoscopes, even a headlight or speculum). Never assume any device, drug, or consumable is available, and never build a plan that waits for a result that may never come.\n\n•\tAsk about availability only when the answer changes the next step, and never about unrelated equipment. When the case is stable, ask as question 1 of \"Now tell me\", as one grouped question with \"متاح\" or \"مش متاح\" per item. In emergencies, give safety instructions first and ask afterward.\n\n•\tEpistaxis: ask about packing and hemostatic materials (sponge pack, ribbon gauze, absorbable hemostatic, balloon, topical vasoconstrictor, tranexamic acid, cautery). Ear canal injury: ask about otoscope or microscope, suction, ear drops, wick or gauze.\n\n•\tAsk once per resource. Do not stall the reply: give safe actions and a bedside interim plan first, then two short branches \"لو متاح\" and \"لو مش متاح\". After the answer, follow only the matching branch.\n\n•\tIf unavailable, use bedside alternatives without implying equal accuracy. Hearing: Rinne, Weber, whisper test, otoscopy; for suspected sudden sensorineural loss, discuss treatment with the senior urgently and arrange audiometry at the earliest suitable facility. Larynx and voice: voice quality, stridor, drooling, neck findings; mirror laryngoscopy only if tolerated and never in a compromised airway; arrange early visualization or transfer. Nose: headlight or torch with speculum, suction, topical agents; never delay hemorrhage control for an endoscope. Fish bone or hypopharyngeal foreign body: oropharynx exam with light and tongue depressor, no blind instrumentation, early referral for endoscopy.\n\n•\tIf a missing resource makes local care unsafe, say so and tell the resident to call the senior now. Say where the test can be done and how urgent it is. Do not suggest next-day outpatient care when emergency evaluation is needed.\n\nHIGH-RISK ENT\n\n•\tButton battery (suspected contact, ingestion, aspiration): top emergency; urgent removal without delaying for imaging when suspicion is high.\n\n•\tDeep neck infection (Ludwig's, parapharyngeal, retropharyngeal): airway first (stridor, drooling, trismus); no forced oral exam if airway compromise is impending.\n\n•\tEpistaxis: advise against simultaneous bilateral septal cautery (septal perforation).\n\nEPISTAXIS AND SUSPECTED NASAL MASS\n\n•\tHemostasis, airway, and circulation come first; never delay control of severe bleeding because of a possible mass. Assess stability, severity, laterality, recurrence, trauma, anticoagulants, likely site.\n\n•\tConsider a mass without overstating it. Red flags: unilateral recurrent bleeding, unilateral obstruction, visible mass or friable tissue, adolescent male with profuse unilateral bleeding (juvenile angiofibroma), older age with risk factors, smoking or occupational exposure, facial pain or numbness, proptosis, neck node, prior head and neck cancer, bleeding out of proportion. A vascular tumor can occur outside the classic age, sex, or site.\n\n•\tIf a mass is possible and bleeding is controllable: avoid unnecessary traumatic instrumentation, blind forceful packing (including a large sponge pack pushed blindly), and blind cautery of a vascular lesion. This is clinical reasoning, not an established protocol; the final choice is a bedside decision with the senior. It must never prevent effective hemostasis in severe or ongoing bleeding.\n\n•\tSteps: stabilize airway and circulation, IV access, cross-match if significant; gentle suction under light; consider topical vasoconstrictor and tranexamic acid (verify dose); find the bleeding point under vision; if packing is needed, use the least traumatic effective method (for example a small gentle pack under vision, reassess before packing more); no biopsy in the ER; contrast CT or MRI when a vascular tumor is suspected, CT angiography or angiographic assessment for severe or persistent bleeding; if bleeding is severe, use whatever effective pack, balloon, or posterior packing is available, mention its risks, call the senior now, and discuss interventional radiology or surgery; document the concern, decisions, risks, and the discussion with the patient or family.\n\n•\tIf a mass is unlikely: sustained pressure, topical agents, cautery of an identified point, anterior packing, then posterior packing or balloon when needed. State which step fits.\n\n•\tIf a pack is placed: removal plan, who, where, and return precautions. If a mass was suspected and bleeding stops, arrange ENT follow-up with endoscopy and imaging; do not close it as simple epistaxis.\n\nEAR CANAL LACERATION FROM AN OBJECT (pencil, key, cotton bud; any age or immune status)\n\n•\tEvidence: no high-quality trial or guideline exists for minor lacerations. Stenosis is reported mainly after severe trauma. In a small pediatric polytrauma series all patients got antibiotic drops and still developed stenosis. Prevention is not standardized. Textbooks advise antibiotic and steroid drops, with a wick or gauze when the canal is too swollen. State this honestly and label the choices below as clinical reasoning.\n\n•\tAlways check: object and depth, time since injury, bleeding or clear fluid, hearing loss, vertigo, facial weakness, whether the tympanic membrane is seen, retained fragment, tetanus status, age, diabetes or immune compromise, and non-accidental injury in a child. If the membrane, ossicles, facial nerve, temporal bone, or CSF may be involved, it is more than a simple laceration: call the senior now and consider CT temporal bone.\n\n•\tSuperficial, clean, membrane intact: gentle aural toilet, keep dry, no packing, drops optional, review in a few days. Deep or circumferential, exposed cartilage or bone, marked edema: consider antibiotic and steroid drops with a wick or lubricated gauze to keep the lumen open, review in 2 to 3 days. Perforation or membrane not seen: avoid aminoglycoside drops, prefer fluoroquinolone-based drops, no irrigation. Diabetic, immunocompromised, or elderly: lower threshold for fluoroquinolone drops (cover Pseudomonas), earlier follow-up; severe pain, granulation, cranial nerve palsy, or fever suggest necrotizing otitis externa and need the senior; systemic antibiotics only for cellulitis or perichondritis, with the senior. Child: may need sedation; involve the senior early.\n\n•\tUpdate tetanus if due. Give a clear recommendation (wick, drops, or nothing) with the reason, the review date, wick removal plan, and return precautions. At follow-up check for early narrowing. Late complications: stenosis, conductive loss, cholesteatoma.\n\nMEDICATION SAFETY\n\n•\tNever state a dose from memory when uncertain; if it cannot be verified, say so and ask for confirmation from the formulary, a current reference, or the senior. Children: get the weight in kg first. Check age, allergies, pregnancy, current drugs, renal or hepatic impairment, and contraindications.\n\n•\tSeparate adult and pediatric doses; state route, frequency, duration, maximum when verified; metric units; distinguish concentration from dose. Never invent concentrations, maximums, or dilutions. Consider interactions (anticoagulants, antiplatelets).\n\n•\tPrefer drugs common in Egypt without substituting an unsuitable one. No automatic antibiotics: state the indication or say they are unnecessary. Be careful with systemic steroids, vasoconstrictors, and ototoxic drops. In unstable cases never delay resuscitation to check references. If the resident proposes an unsafe drug or dose, say so and give the safer step. Mark off-label or limited-evidence use.\n\nDISPOSITION\n\nEnd each assessment with one of: discharge (only if stable, dangers addressed, return precautions given), observation (what to monitor and what triggers escalation), admission (indication and team), urgent transfer or senior escalation (urgency and reason).\n\nIMAGES, VIDEO, PDF, AUDIO\n\n•\tImaging (CT, MRI, X-ray, endoscopy, otoscopy, audiogram, photos): state type and quality, describe findings as short bullets, give an impression, and say it is \"not a formal radiology report\"; say what a radiologist or better study should confirm. If unclear, cropped, or without side, ask for a better one. A non-ENT finding is mentioned as incidental with a referral, not interpreted in depth. Clinical photos and endoscopy images count as bedside findings.\n\n•\tVideo: describe what you see and the limits; if unreadable, ask for 3 to 5 still frames plus a short description. PDF: summarize key findings and flag abnormal values. Dictation: confirm ambiguous laterality, drug names, or numbers. Do not read or repeat names or IDs in media; remind the resident to crop them.\n\nRIGHT-TO-LEFT CONSISTENCY (follow strictly)\n\n•\tEvery line starts with an Arabic word, never an English word, digit, or symbol-only token. If the natural first word is English, put an Arabic word before it (\"افحص\" before \"otoscopy\", \"ابعت\" before \"CBC\", \"أعطي\" before a drug name). Start every line with the invisible mark U+200F.\n\n•\tBody lines end with an Arabic word or an emoji, never an English word, digit, unit, or bracket. Headings and code blocks are the only exceptions.\n\n•\tUse Arabic punctuation (\"،\" \"؛\" \"؟\"). Never put punctuation, digits, brackets, or slashes next to an English term at a line edge.\n\n•\tOne sentence per line; a sentence mixing Arabic and English never shares its line. At most two English terms in a row. Doses and units go mid-line. One drug per bullet, starting with an Arabic word (\"أعطي\", \"استخدم\").\n\n•\tFully English text (senior report, SBAR, referral) goes in a code block; Arabic comments go outside it.\n\nHEADINGS AND SPACING\n\n•\tEvery heading is \"## \" plus a BOLD title: Arabic title, space, dash, space, English term, then the symbol at the end. Example: ## خطر عاجل - URGENT 🚨. Use exactly the headings in the template.\n\n•\tTwo blank lines between sections: after a section's last line, an empty line, a line containing only U+2800 (⠀), an empty line, then the next heading. One blank line between bullet groups. Never write a paragraph; one idea per bullet, about 12 words.\n\nFORMAT\n\n•\tMarkdown. Symbols: 🚨 urgent, 🩺 impression, ✅ do now, ❓❓ questions with 🙋‍♂️, 🔍 differential, 🧪 tests, 🔄 referral, 💊 treatment, 🏥 disposition, 📚 source, 🎯 confidence, 📞 senior report. Bold only critical items and headings. Numbered steps only for ordered actions. Tables only to compare options.\n\n•\tIn emergencies put URGENT and Do now first, then questions, then the rest, each short. Template (drop sections not needed; ⠀ is the spacer line):\n\nخطر عاجل - URGENT 🚨\n\n•\tسطر عن الخطر\n\n•\tأول إجراء\n\n•\tكلم السنيور حالًا\n\n⠀\n\nالانطباع - IMPRESSION 🩺\n\n•\tسطر واحد\n\n⠀\n\nاعمل دلوقتي - DO NOW ✅\n\n1.\tأهم خطوة\n\n2.\tالخطوة اللي بعدها\n\n⠀\n\nقولي دلوقتي - NOW TELL ME ❓❓🙋‍♂️\n\nأنا مستني إجابتك على الأسئلة دي:\n\n1.\tالسؤال الأهم، أو الأجهزة المتاحة لو لازم\n\n2.\tالسؤال التاني\n\n📩 رد برقم السؤال وإجابته، مثلًا: \"1: أيوه، 2: لأ\"\n\n📩 لو معلومة مش متاحة قول \"مش متاح\"\n\n⠀\n\nThen the same pattern (heading, short bullets, spacer line) for these sections, in order: ## التشخيص التفريقي - Differential 🔍 (most likely, then most dangerous); ## الفحوصات - Tests 🧪 (needed now with why, only if, not needed, bedside alternative if unavailable); ## التحويل - Referral 🔄 (what was examined and what remains, which specialty, urgency); ## الخطة - Plan 💊 (treatment, follow-up, return precautions); ## التصرف - Disposition 🏥; ## المرجع - Source 📚 (guideline family, or \"clinical reasoning\"); ## درجة الثقة - Confidence 🎯 (high, moderate, or low, with the reason); ## بلاغ للسنيور - Senior report 📞 (one line: copy it, and phone the senior first in emergencies; then the code block).\n\nSENIOR REPORT\n\nEnd every case reply, except trivial questions, with a short English report in a code block for the resident to send to a more senior doctor: at most 6 lines, only facts given so far, missing items as \"not available\", no invented findings or vitals, no name or ID, most urgent problem first, never wait for results. Don't uses labels or prefixes before any line. Full line space between and separate lines\n\n\nURGENT: <only if a red flag exists, one line>\n\n<age, sex, setting, main problem, time course>\n\n <relevant history, comorbidities, anticoagulants, allergies>\n\n<vitals, airway status, key exam findings, working impression>\n\n<what has been done, and what I need: advice, come to see, transfer>\n\n\nQUESTIONS\n\n•\tMaximum 4 questions, most critical first, only if the answer changes management, bedside-answerable first, ENT first. Equipment availability is question 1 when the plan depends on it (not in emergencies).\n\n•\tPut them right after \"Do now\". If a critical answer is missing, still give safe actions and say the plan will be refined. Do not repeat answered questions. Skip the section if none.\n\nSAFETY SCAN (always first)\n\nAirway compromise (stridor, drooling, trismus, muffled voice, distress); active or recurrent bleeding; expanding neck swelling or hematoma; deep neck infection; epiglottitis; foreign body (airway, button battery, magnets, sharp esophageal object); orbital cellulitis or vision change; intracranial signs after sinusitis or otitis; CSF leak; facial palsy; sudden hearing loss; vertigo with neurological signs; trauma (septal hematoma, temporal bone, laryngeal, facial fractures); penetrating ear canal injury; post-operative complications. Children, diabetics, immunocompromised and anticoagulated patients lower the threshold. If a red flag is possible, start with URGENT and tell the resident to call the senior now, before any test.\n\nEVIDENCE\n\nPriority: 1. Egyptian Ministry of Health and Egyptian ENT society guidance, when they exist. 2. AAO-HNSF and other American guidance. 3. NICE, ENT UK, and other British guidance. Name the guideline family in Source. Never invent a guideline, year, citation, or statistic. If unsure an Egyptian guideline exists, say so in Arabic, say you follow American or British guidance, and advise local verification. Say clearly when advice is clinical reasoning or low-quality evidence (case reports, textbooks).\n\nCOMMANDS (the resident types one word)\n\n•\tescalate: regenerate the senior report with the latest information, in a code block, fully in English.\n\n•\trefer: short English referral message to the other specialty, in a code block: reason, ENT history and findings, what was excluded and what remains unassessed, urgency, the question. Do not include that specialty's tests.\n\n•\tplan: management plan as bullets: immediate actions, findings to monitor, tests only if justified and available (with the bedside alternative), treatment, referral, disposition, follow-up, what would change the plan, assumptions. Include a senior's opinion if given.\n\n•\tsummary: 5-line handover, one sentence per line. new: treat the next message as a new case and forget the previous patient.\n\nPRIVACY AND HONESTY\n\nNever ask for or repeat patient name, file number, phone, or ID. If you disagree with the resident's plan, say so respectfully and explain why. State uncertainty honestly; do not guess missing facts. You are decision support only, not a replacement for the senior, the clinical examination, or local protocols. End every substantial answer, after the senior report, with this line in Arabic only: _للدعم في القرار فقط،";

let DB = loadDB();
function loadDB(){
  let d; try{ d = JSON.parse(localStorage.getItem(DBKEY)) }catch{}
  d = d || {};
  d.patients = d.patients || {};
  d.visits = d.visits || [];
  d.settings = Object.assign({lang:'ar', theme:'blue', doctor:'', clinic:'', clinicInfo:'', ai:'gemini', aiLang:'auto', onboarded:false}, d.settings||{});
  if(!['blue','dark','teal','ocean'].includes(d.settings.theme)) d.settings.theme='blue';
  // migrate v1 cases
  try{ const old = JSON.parse(localStorage.getItem('otolarix.cases')||'[]');
    old.forEach(c=>{ if(!d.visits.some(v=>v.id===c.id)) d.visits.push(Object.assign({updated:Date.now()}, c)) });
    localStorage.removeItem('otolarix.cases') }catch{}
  return d;
}

function parseAge(s){ if(!s)return null; const m=String(s).match(/([\d.]+)\s*(m|mo|month|شهر)?/i); if(!m)return null; return m[2]? +m[1]/12 : +m[1] }

function audio(v){
  const a=v.aud||{};
  const f=p=>{const x=[0,1,2,3].map(i=>a[p+i]); if(x.every(y=>y!==undefined))return Math.round(x.reduce((s,y)=>s+y)/4); if(x.slice(0,3).every(y=>y!==undefined))return Math.round((x[0]+x[1]+x[2])/3); return null};
  const r={RA:f('RA'),RB:f('RB'),LA:f('LA'),LB:f('LB')};
  r.abgR = r.RA!=null&&r.RB!=null ? r.RA-r.RB : null;
  r.abgL = r.LA!=null&&r.LB!=null ? r.LA-r.LB : null;
  let n=0; for(let i=0;i<4;i++){const x=a['RB'+i]??a['RA'+i],y=a['LB'+i]??a['LA'+i]; if(x!=null&&y!=null&&Math.abs(x-y)>=15)n++}
  r.asym = n>=2;
  r.snhl = ['R','L'].filter(s=>{const ac=r[s+'A'],abg=r['abg'+s];return ac!=null&&ac>25&&abg!=null&&abg<10});
  return r;
}

function missing(v, forceEn){
  const L=(ar,en)=>(forceEn||EN())?en:ar;
  const m=[];
  if(!v.cc) m.push(L('الشكوى الأساسية','Chief complaint'));
  if(!v.ccDur) m.push(L('المدة','Duration'));
  if(!ageOf(v)) m.push(L('العمر','Age'));
  const ag=parseAge(ageOf(v)); if(ag!=null&&ag<16&&!v.weight) m.push(L('الوزن (طفل)','Weight (child)'));
  if(!v.airway) m.push('Airway');
  if(!v.hr&&!v.bp&&!v.spo2) m.push(L('العلامات الحيوية','Vitals'));
  if(!v.allergy) m.push(L('الحساسية','Allergies'));
  if(!v.anticoag) m.push('Anticoagulants');
  if(!Object.values(v.exam||{}).some(x=>x.s)) m.push(L('الفحص','Examination'));
  return m;
}

  const fl=FLAGS.filter(([k])=>(v.flags||[]).includes(k)).map(x=>x[1]);
  out.push(`Red flags reported: ${fl.length?fl.join('; '):'none reported (not a confirmed absence)'}.`);
  if(v.hpi) out.push(`HPI: ${v.hpi}`);
  out.push(`PMH: ${val(v.pmh)}. Prior ENT surgery: ${val(v.psh)}. Medications: ${val(v.meds)}. Anticoagulants: ${val(v.anticoag)}. Allergies: ${val(v.allergy)}.`);

  if(v.inv) out.push(`Investigations/results: ${v.inv}`);

    const ok=names.filter(n=>/flash/i.test(n)&&!/(image|tts|audio|live|embed|vision|robotics|computer)/i.test(n));
    const score=n=>{ const v=parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/i)||[])[1])||0; return v*10-(/lite/i.test(n)?4:0)-(/(preview|exp)/i.test(n)?1:0) };
    const list=(ok.length?ok:names).slice().sort((a,b)=>score(b)-score(a));
    return list;
  },
  async connect(key){
    const names=await this.models(key);
    const order=this.pick(names);
    if(!order.length) throw Object.assign(new Error(L('لا يوجد موديل متاح لهذا المفتاح','No model available for this key')),{status:0});
    S().geminiKey=key; S().geminiModels=order; S().geminiModel=order[0]; persist();
    return order[0];
  },
  human(e){
    if(e.nokey) return L('فعّل Gemini المجاني الأول من الإعدادات.','Set up free Gemini first in Settings.');
    if(!navigator.onLine) return L('مفيش إنترنت.','No internet connection.');
    if(e.status===400||e.status===401) return L('المفتاح غير صحيح. انسخه تاني من Google AI Studio.','Invalid key. Copy it again from Google AI Studio.');
    if(e.status===403) return L('جوجل رفض الطلب (403). غالبًا الخطة المجانية غير متاحة لهذا المشروع. اعمل مفتاح جديد من AI Studio.','Google refused the request (403). The free tier may be unavailable for this project; create a new key in AI Studio.');
    if(e.status===429) return L('وصلت للحد المجاني حاليًا. استنى شوية، أو استخدم Claude/ChatGPT.','Free limit reached for now. Wait a little, or use Claude/ChatGPT.');
    return L('حصل خطأ: ','Error: ')+e.message;
  },
  async generate(contents, {system=true, json=false}={}){
    const key=this.key(); if(!key) throw Object.assign(new Error('nokey'),{nokey:true});
    if(!S().geminiModel) await this.connect(key);
    const models=[S().geminiModel, ...(S().geminiModels||[]).filter(m=>m!==S().geminiModel)].slice(0,3);
    let last;
    for(const model of models){
      const body={contents, generationConfig:{temperature:json?0.1:0.3}};
      if(system) body.systemInstruction={parts:[{text:DEFAULT_PROMPT+APP_RULES+(aiEN()?LANG_EN:'')}]};
      if(json) body.generationConfig.responseMimeType='application/json';
      const r=await fetch(`${this.base}/${model}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
      if(r.ok){
        const j=await r.json(), c=j.candidates&&j.candidates[0];
        const t=c&&c.content&&(c.content.parts||[]).map(p=>p.text||'').join('');
        if(t){ if(model!==S().geminiModel){ S().geminiModel=model; persist() } return t }
        last=Object.assign(new Error((c&&c.finishReason)||'empty reply'),{status:0});
      } else {
        last=await this.err(r);
        if(![404,429,500,503].includes(last.status)) break;   // only fall back to another model for these
      }
    }
    throw last;
  }
};
function md(t){
  const lines=esc(t).split('\n'); let out='', inCode=false, code=[], list=null;
  const close=()=>{ if(list){ out+=`</${list}>`; list=null } };
  const inl=x=>x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  for(const raw of lines){
    const l=raw.replace(/‏/g,'');
    if(/^\s*```/.test(l)){ if(inCode){ out+=`<pre><button class="btn sm sec" onclick="copy(this.parentNode.innerText.replace(/^(Copy report|نسخ التقرير)\\n?/,''));toast('✔')">${L('نسخ التقرير','Copy report')}</button>${code.join('\n')}</pre>`; code=[]; inCode=false } else { close(); inCode=true } continue }
    if(inCode){ code.push(l); continue }
    let m;
    if((m=l.match(/^\s*#{1,4}\s+(.*)/))){ close(); out+=`<h4>${inl(m[1])}</h4>`; continue }
    if((m=l.match(/^\s*[-•*]\s+(.*)/))){ if(list!=='ul'){ close(); out+='<ul>'; list='ul' } out+=`<li>${inl(m[1])}</li>`; continue }
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=='ol'){ close(); out+='<ol>'; list='ol' } out+=`<li>${inl(m[1])}</li>`; continue }
    if(l.trim()==='' || l.trim()==='⠀') continue;   // blank lines must not break a numbered list
    close();
    out+=`<div>${inl(l)}</div>`;
  }
  if(inCode) out+=`<pre>${code.join('\n')}</pre>`;
  close(); return out;
}

}
function renderOnboardingStep(){

   <div class="wizard-progress" aria-label="${L('خطوة','Step')} ${step} ${L('من 3','of 3')}"><span class="${step>=1?'on':''}"></span><span class="${step>=2?'on':''}"></span><span class="${step>=3?'on':''}"></span></div>
   <div class="wizard-step-title">${L('الخطوة','Step')} ${step} / 3 · ${step===1?L('اللغة والعيادة','Language & clinic'):step===2?L('إعداد الذكاء الاصطناعي','AI setup'):L('المظهر','Appearance')}</div>${content}
   <div class="wizard-actions">${step>1?`<button class="btn ghost" onclick="onboardingBack()">${L('رجوع','Back')}</button>`:''}${step<3?`<button class="btn" onclick="onboardingNext()">${L('التالي','Next')} →</button>`:`<button class="btn" onclick="finishOnboarding()">${L('ابدأ ✔','Start ✔')}</button>`}</div></div>`);

/* =================== PATIENTS =================== */
function vPatients(){
  $('app').innerHTML = `<h1 class="page">👥 ${L('المرضى','Patients')}</h1>
  <div class="card"><div class="row"><input id="pq" placeholder="🔎 ${L('ابحث بالاسم أو الكود أو التليفون','Search by name, code or phone')}" oninput="drawPatients()" style="flex:1"><button class="btn" onclick="newPatientModal()">➕ ${L('مريض جديد','New patient')}</button></div></div>
  <div class="card"><div class="list" id="plist"></div></div>`;
  drawPatients();
}
function drawPatients(){
  const q=($('pq').value||'').toLowerCase();
  const ps=patients().filter(p=>!q||[p.name,p.code,p.phone].some(x=>(x||'').toLowerCase().includes(q)));
  $('plist').innerHTML = ps.length? ps.sort((a,b)=>(b.updated||0)-(a.updated||0)).map(p=>{
    const vs=visits().filter(v=>v.patient===p.code), last=vs.sort((a,b)=>b.created.localeCompare(a.created))[0];
    const nf=vs.filter(v=>v.rx&&v.rx.followUp&&!v.fuDone).map(v=>v.rx.followUp).sort()[0];
    return `<div class="item" onclick="go('patient/${p.code}')"><div class="av">${esc((p.name||p.code).charAt(0))}</div>
    <div class="grow"><div class="ell"><b>${esc(p.name||p.code)}</b> <span class="muted">· ${p.code}${p.birthYear?' · '+(new Date().getFullYear()-p.birthYear)+L(' سنة',' y'):''}</span></div>
    <div class="muted ell">${vs.length} ${L('زيارة','visits')}${last?' · '+L('آخر زيارة','last')+': '+fmtDate(last.created)+' · '+esc(last.cc||''):''}</div></div>
    ${nf?`<span class="tag ${nf<=today()?'urgent':''}">📅 ${fmtDate(nf)}</span>`:''}</div>`}).join('')
   : `<p class="muted">${L('لا يوجد مرضى بعد.','No patients yet.')}</p>`;
}
function nextCode(){ let n=patients().length+1, c; do{ c='P-'+String(n).padStart(4,'0'); n++ }while(DB.patients[c]); return c }
function newPatientModal(after){
  modal(`<h2>➕ ${L('مريض جديد','New patient')}</h2>
  <div class="alert info">🔒 ${L('الاسم والتليفون يُحفظان عندك فقط ولا يُرسلان للذكاء الاصطناعي.','Name and phone are stored only for you and are never sent to the AI.')}</div>
  <div class="grid"><div class="wide" style="grid-column:1/-1"><label>${L('الاسم','Name')}</label><input id="npName"></div>
  <div><label>${L('سنة الميلاد','Birth year')}</label><input id="npYear" type="number" min="1900" max="${new Date().getFullYear()}"></div>
  <div><label>${L('الجنس','Sex')}</label><select id="npSex"><option value="">—</option><option>Male</option><option>Female</option></select></div>
  <div style="grid-column:1/-1"><label>${L('التليفون (اختياري)','Phone (optional)')}</label><input id="npPhone" type="tel"></div></div>
  <div class="row" style="margin-top:12px"><button class="btn" onclick="savePatient(${after?`'${after}'`:''})">${L('حفظ','Save')}</button><button class="btn ghost" onclick="closeModal()">${L('إلغاء','Cancel')}</button></div>`);
  setTimeout(()=>{ const e=$('npName'); if(e) e.focus() },50);
}
function savePatient(after){
  const name=$('npName').value.trim(); if(!name){ toast(L('اكتب اسم المريض','Enter the patient name')); return }
  const code=nextCode();
  DB.patients[code]={code,name,birthYear:$('npYear').value||'',sex:$('npSex').value,phone:$('npPhone').value.trim(),created:new Date().toISOString(),updated:Date.now()};
  persist(); closeModal();
  if(after==='visit'){ curVisit.patient=code; curVisit.sex=curVisit.sex||DB.patients[code].sex; saveVisit(); vVisit(curVisit.id) }
  else go('patient/'+code);
}

  const vs=visits().filter(v=>v.patient===code).sort((a,b)=>b.created.localeCompare(a.created));
  const events=[];
  vs.forEach(v=>{
    events.push({d:v.created, html:`<div class="ev ${rules(v).u.length?'urg':''}"><div class="card" style="margin:0">
      <div class="row"><b>${fmtDate(v.created,true)}</b>${rules(v).u.length?'<span class="tag urgent">URGENT</span>':''}${v.signed?`<span class="tag signed">${L('معتمدة','Signed')}</span>`:`<span class="tag draft">${L('مسودة','Draft')}</span>`}</div>
      <div style="margin:6px 0"><b>${L('الشكوى','Complaint')}:</b> ${esc(v.cc||'—')}${v.rx&&v.rx.diagnosis?`<br><b>${L('التشخيص','Diagnosis')}:</b> ${esc(v.rx.diagnosis)}`:''}${v.rx&&v.rx.meds&&v.rx.meds.length?`<br><b>${L('العلاج','Treatment')}:</b> ${esc(v.rx.meds.map(m=>m.name).filter(Boolean).join('، '))}`:''}</div>
      <div class="row"><button class="btn sm sec" onclick="go('visit/${v.id}')">${L('فتح','Open')}</button>${v.signed?`<button class="btn sm sec" onclick="go('rx/${v.id}')">🧾 ${L('الروشتة','Prescription')}</button>`:''}</div></div></div>`});
    if(v.rx&&v.rx.followUp) events.push({d:v.rx.followUp+'T09:00', html:`<div class="ev fu"><div class="card" style="margin:0"><b>📅 ${L('متابعة','Follow-up')} · ${fmtDate(v.rx.followUp)}</b> ${v.fuDone?`<span class="tag signed">${L('تمت','Done')}</span>`:v.rx.followUp<today()?`<span class="tag urgent">${L('متأخرة','Overdue')}</span>`:''}
      <div class="muted">${esc(v.rx.diagnosis||v.cc||'')}</div>${v.fuDone?'':`<button class="btn sm" style="margin-top:6px" onclick="startVisit('${code}','${v.id}')">▶ ${L('ابدأ زيارة المتابعة','Start follow-up visit')}</button>`}</div></div>`});
  });
  events.sort((a,b)=>b.d.localeCompare(a.d));
  $('app').innerHTML = `<div class="hero"><div class="av" style="width:56px;height:56px;font-size:24px;background:rgba(255,255,255,.2);color:#fff">${esc(p.name.charAt(0))}</div>
   <div><h1>${esc(p.name)}</h1><p>${p.code}${p.birthYear?' · '+(new Date().getFullYear()-p.birthYear)+L(' سنة',' years'):''}${p.sex?' · '+p.sex:''}${p.phone?' · '+esc(p.phone):''}</p></div>
   <button class="btn" onclick="startVisit('${code}')">🩺 ${L('زيارة جديدة','New visit')}</button>${vs[0]?`<button class="btn" onclick="startVisit('${code}','${vs[0].id}')">🔄 ${L('متابعة آخر زيارة','Follow up last visit')}</button>`:''}</div>
  <div class="card"><h2><span class="ic">🕰️</span>${L('التاريخ المرضي (الخط الزمني)','History timeline')}</h2>
  ${events.length?`<div class="tl">${events.map(e=>e.html).join('')}</div>`:`<p class="muted">${L('لا توجد زيارات بعد.','No visits yet.')}</p>`}</div>
  <div class="row noprint"><button class="btn red sm" onclick="delPatient('${code}')">🗑 ${L('حذف المريض','Delete patient')}</button></div>`;
}
function delPatient(code){ if(!confirm(L('حذف المريض وكل زياراته من هذا الجهاز؟','Delete this patient and all visits?')))return; DB.patients[code].deleted=true; DB.patients[code].updated=Date.now(); DB.visits.forEach(v=>{ if(v.patient===code){v.deleted=true;v.updated=Date.now()} }); persist(); go('patients') }

/* =================== AGENDA / TIME =================== */
function vAgenda(){
  const t=today(), fu=followUps(), wk=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  const grp=[[L('متأخرة','Overdue'),fu.filter(x=>x.date<t),'red'],[L('اليوم','Today'),fu.filter(x=>x.date===t),'amber'],[L('خلال 7 أيام','Next 7 days'),fu.filter(x=>x.date>t&&x.date<=wk),''],[L('لاحقًا','Later'),fu.filter(x=>x.date>wk),'']];
  const todays=visits().filter(v=>(v.created||'').slice(0,10)===t).sort((a,b)=>a.created.localeCompare(b.created));
  const mins=todays.filter(v=>v.signed&&v.started).map(v=>Math.round((new Date(v.signed)-new Date(v.started))/6e4));
  $('app').innerHTML = `<h1 class="page">📅 ${L('المواعيد وإدارة الوقت','Agenda & time')}</h1>
  <div class="stats"><div class="stat"><div class="muted">${L('حالات اليوم','Cases today')}</div><div class="v">${todays.length}</div></div>
  <div class="stat ok"><div class="muted">${L('وقت الحالات المعتمدة اليوم','Time on signed cases today')}</div><div class="v">${mins.reduce((a,b)=>a+b,0)} <small style="font-size:13px">${L('دقيقة','min')}</small></div></div>
  <div class="stat red"><div class="muted">${L('متابعات متأخرة','Overdue follow-ups')}</div><div class="v">${grp[0][1].length}</div></div></div>
  <div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
  <div>${grp.map(([title,items,c])=>`<div class="card"><h2><span class="ic">${c==='red'?'⏰':c==='amber'?'📌':'🗓️'}</span>${title} <span class="tag">${items.length}</span></h2>
    <div class="list">${items.map(x=>`<div class="item"><div class="grow" onclick="go('patient/${x.v.patient}')"><b>${esc(pName(x.v.patient))}</b> · ${esc(x.v.rx.diagnosis||x.v.cc||'')}<div class="muted">${fmtDate(x.date)}${(DB.patients[x.v.patient]||{}).phone?' · 📞 '+esc(DB.patients[x.v.patient].phone):''}</div></div>
    <button class="btn sm" onclick="startVisit('${x.v.patient}','${x.v.id}')">▶ ${L('ابدأ المتابعة','Start follow-up')}</button><button class="btn sm sec" onclick="fuDone('${x.v.id}')">✔ ${L('تمت','Done')}</button></div>`).join('')||`<p class="muted">—</p>`}</div></div>`).join('')}</div>
  <div class="card"><h2><span class="ic">⏱️</span>${L('حالات اليوم بالترتيب','Today\'s cases')}</h2>
   <div class="list">${todays.map(v=>{const m=v.signed&&v.started?Math.round((new Date(v.signed)-new Date(v.started))/6e4):null;
     return `<div class="item" onclick="go('visit/${v.id}')"><div class="av">${new Date(v.created).toLocaleTimeString(EN()?'en-GB':'ar-EG',{hour:'2-digit',minute:'2-digit'})}</div><div class="grow"><b>${esc(pName(v.patient))}</b> · ${esc(v.cc||'—')}</div>${m!=null?`<span class="tag signed">${m} ${L('د','min')}</span>`:`<span class="tag draft">${L('جارية','In progress')}</span>`}</div>`}).join('')||`<p class="muted">${L('لا توجد حالات اليوم.','No cases today.')}</p>`}</div></div></div>`;
}
function fuDone(id){ const v=DB.visits.find(x=>x.id===id); v.fuDone=true; v.updated=Date.now(); persist(); vAgenda(); toast(L('تم','Done')) }

function startVisit(code, prevId){
  const v={id:uid('v'),patient:code||'',created:new Date().toISOString(),started:new Date().toISOString(),updated:Date.now(),setting:'ER',flags:[],exam:{},aud:{},res:{},rx:{meds:[]}};
  if(code&&DB.patients[code]) v.sex=DB.patients[code].sex;
  // carry over stable data from the previous visit (or the one being followed up)
  const last=code? visits().filter(x=>x.patient===code).sort((a,b)=>b.created.localeCompare(a.created))[0] : null;
  const src=prevId? DB.visits.find(x=>x.id===prevId) : last;
  if(src){ ['pmh','psh','allergy','anticoag','meds','sex'].forEach(k=>{ if(src[k]&&!v[k]) v[k]=src[k] }) }
  if(prevId&&src){
    v.prevVisit=prevId; v.setting='Clinic';
    v.cc='Follow-up: '+((src.rx&&src.rx.diagnosis)||src.cc||'');
    const rxMeds=((src.rx&&src.rx.meds)||[]).map(m=>m.name).filter(Boolean).join(', ');
    v.meds=[src.meds,rxMeds?('(prescribed at last visit: '+rxMeds+')'):''].filter(Boolean).join(' ');
    src.fuDone=true; src.updated=Date.now();
  }
  DB.visits.unshift(v); persist();
  location.replace('#visit/'+v.id);
}

function visitSectionText(card){

  if(i===2)return vals(['age','sex','weight','setting']).join(' · ')||L('بيانات الزيارة غير مكتملة','Visit details not entered');
  if(i===3)return vals(['hr','bp','spo2','rr','temp']).map((x,n)=>['HR','BP','SpO₂','RR','°C'][n]+': '+x).join(' · ')||L('لم تُدخل العلامات الحيوية','No vitals entered');

function exportData(){ const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='otolarix-backup-'+today()+'.json'; a.click() }
function importData(e){ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ merge(JSON.parse(r.result)); persist(); toast(L('تم الاستيراد','Imported')); render() }catch{ toast(L('ملف غير صالح','Invalid file')) } }; r.readAsText(f) }
function wipe(){ if(!confirm(L('مسح كل الحالات والمرضى من هذا الجهاز نهائيًا؟','Permanently erase all cases and patients from this device?')))return; const s=DB.settings; DB={patients:{},visits:[],settings:s}; persist(); render() }
/* merge two DBs: newest record wins (deletions kept as tombstones) */
function merge(other){
  if(!other) return;
  Object.values(other.patients||{}).forEach(p=>{ const m=DB.patients[p.code]; if(!m||(p.updated||0)>(m.updated||0)) DB.patients[p.code]=p });
  (other.visits||[]).forEach(v=>{ const i=DB.visits.findIndex(x=>x.id===v.id); if(i<0) DB.visits.push(v); else if((v.updated||0)>(DB.visits[i].updated||0)) DB.visits[i]=v });
}

async function activate(){
  const name=($('actName').value||'').trim(), code=($('actCode').value||'').trim().toUpperCase();
  if(!name||!code){ toast(L('اكتب اسمك ومفتاح التفعيل','Enter your name and the activation key')); return }
  const b=$('actBtn'); b.disabled=true;
  try{
    const j=await actCall({action:'activate',code,device:deviceId(),name});
    if(j&&j.ok){ S().activation={code,at:new Date().toISOString(),name}; if(!S().doctor) S().doctor=name; persist(); toast(L('✔ تم التفعيل، أهلًا بك','✔ Activated, welcome')); render(); return }
    const e=j&&j.error;
    toast(e==='used'? L('المفتاح ده اتستخدم قبل كده على جهاز تاني.','This key was already used on another device.') : e==='revoked'? L('المفتاح ده متوقف. تواصل مع صاحب التطبيق.','This key has been disabled. Contact the app owner.') : L('المفتاح غير صحيح.','Invalid key.'));
  }catch{ toast(L('مفيش اتصال. اتأكد من الإنترنت وحاول تاني.','No connection. Check the internet and try again.')) }
  b.disabled=false;
}
async function checkActivation(){
  if(!ACTIVATION_URL||!S().activation||!navigator.onLine) return;
  try{ const j=await actCall({action:'check',code:S().activation.code,device:deviceId()});
    if(j&&j.ok===false&&['revoked','invalid','used'].includes(j.error)){ delete S().activation; persist(); render(); toast(L('تم إيقاف التفعيل على هذا الجهاز.','Activation was removed for this device.')) } }catch{}
}

/* =================== GOOGLE DRIVE SYNC (appDataFolder) =================== */
const Drive = {
  state: JSON.parse(localStorage.getItem('otolarix.drive')||'{}'),
  token:null, exp:0, client:null, fileId:null,
  save(){ localStorage.setItem('otolarix.drive', JSON.stringify(this.state)) },
  load(){ return new Promise((res,rej)=>{ if(window.google&&google.accounts) return res(); const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.onload=res; s.onerror=rej; document.head.appendChild(s) }) },
  async getToken(interactive){
    if(this.token && Date.now()<this.exp) return this.token;
    await this.load();
    return new Promise((res,rej)=>{
      this.client = google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID, scope:'https://www.googleapis.com/auth/drive.appdata email', callback:r=>{
        if(r.error) return rej(r); this.token=r.access_token; this.exp=Date.now()+(r.expires_in-60)*1000; res(this.token) }});
      this.client.requestAccessToken({prompt: (interactive&&!this.state.user)? 'consent' : '', login_hint:this.state.user||undefined});
    });
  },
  async api(url,opt={}){ const t=await this.getToken(false); const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+t}}); if(!r.ok) throw new Error(r.status); return r },
  async signIn(){
    if(!GOOGLE_CLIENT_ID) return;
    try{ await this.getToken(true);
      const u=await (await this.api('https://www.googleapis.com/oauth2/v3/userinfo')).json();
      this.state.user=u.email; this.save(); await this.sync(true); render();
    }catch(e){ toast(L('تعذر تسجيل الدخول','Sign-in failed')) }
  },
  signOut(){ if(this.token&&window.google) google.accounts.oauth2.revoke(this.token); this.token=null; this.state={}; this.save(); render() },
  async findFile(){
    if(this.fileId) return this.fileId;
    const r=await (await this.api("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D'otolarix-db.json'&fields=files(id)")).json();
    this.fileId = r.files&&r.files[0]&&r.files[0].id; return this.fileId;
  },
  hasToken(){ return this.token && Date.now()<this.exp },
  async sync(show){
    if(!GOOGLE_CLIENT_ID||!this.state.user||!navigator.onLine) return;
    if(!this.hasToken() && !show) return; // background sync never opens a Google pop-up
    try{
      const id=await this.findFile();
      if(id){ const remote=await (await this.api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json(); const s=DB.settings; merge(remote); DB.settings=s; const rs=remote.settings||{}; if(!s.geminiKey&&rs.geminiKey){ s.geminiKey=rs.geminiKey; s.geminiModel=rs.geminiModel; s.geminiModels=rs.geminiModels; s.ai='gemini' } localStorage.setItem(DBKEY,JSON.stringify(DB)) }
      await this.upload();
      this.state.last=Date.now(); this.save(); if(show) toast(L('تمت المزامنة ☁️','Synced ☁️'));
      const rn=route().name; if(['home','patients','agenda','settings'].includes(rn)) render();
    }catch(e){ if(show) toast(L('تعذرت المزامنة','Sync failed')) }
  },
  async upload(){
    const body=JSON.stringify({patients:DB.patients,visits:DB.visits,settings:DB.settings,at:Date.now()});
    const id=await this.findFile();
    if(id) await this.api(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});
    else {
      const meta={name:'otolarix-db.json',parents:['appDataFolder']}, b='otolarix'+Date.now();
      const multipart=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
      const r=await (await this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:multipart})).json();
      this.fileId=r.id;
    }
  },
  async push(){ if(!GOOGLE_CLIENT_ID||!this.state.user||!navigator.onLine||!this.hasToken()) return; try{ await this.upload(); this.state.last=Date.now(); this.save() }catch{} }
};

if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
setTimeout(checkActivation,2500);
window.addEventListener('online',()=>Drive.sync(false));
render();
